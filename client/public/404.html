<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>the bank HMDA Tool</title>
    <script>
      // SPA redirect for GitHub Pages - preserves route for client-side router
      // The deploy workflow copies index.html to 404.html at build time,
      // but this fallback handles the redirect for local dev or if that step is skipped.
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/' +
        '?/' + l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/') +
        (l.search ? '&' + l.search.slice(1) : '') + l.hash
      );
    </script>
  </head>
  <body>
    Redirecting...
  </body>
</html>
